name: Fix Voice Cafe seat cache

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'pbnjs0228-source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch seat cache replacement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''  const seatsUnsub = onSnapshot(collection(db, 'voiceCafe', table.id, 'seats'), snap=>{\n    const live = pruneStaleSeats(snap);\n    const liveUids = new Set();\n    live.forEach(({id, data})=>{\n      liveUids.add(id);\n      seatsCache[id] = data;\n      if(id !== myUid && !peers[id]) connectToPeer(table.id, id);\n    });\n    Object.keys(peers).forEach(uid=>{ if(!liveUids.has(uid)) teardownPeer(uid); });\n    renderSeats();\n  });'''
          new = '''  const seatsUnsub = onSnapshot(collection(db, 'voiceCafe', table.id, 'seats'), snap=>{\n    const live = pruneStaleSeats(snap);\n    const liveUids = new Set(live.map(({id}) => id));\n\n    // IMPORTANT: replace the cache from the current Firestore snapshot.\n    // Previously this only added users, so a user who left disappeared from\n    // Firestore but remained in seatsCache forever until the room was rebuilt.\n    const nextSeatsCache = {};\n    live.forEach(({id, data})=>{\n      nextSeatsCache[id] = data;\n      if(id !== myUid && !peers[id]) connectToPeer(table.id, id);\n    });\n    seatsCache = nextSeatsCache;\n\n    // Tear down peers for users who are no longer actually seated.\n    Object.keys(peers).forEach(uid=>{\n      if(!liveUids.has(uid)) teardownPeer(uid);\n    });\n    renderSeats();\n  });'''
          if old not in s:
              raise SystemExit('target seat snapshot block not found; refusing to modify index.html')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix and remove workflow
        run: |
          rm -f .github/workflows/fix-seat-cache.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-seat-cache.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix stale users remaining in Voice Cafe rooms'
          git push
