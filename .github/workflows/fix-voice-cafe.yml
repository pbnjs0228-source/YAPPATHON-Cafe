name: Fix voice cafe
on:
  push:
    paths:
      - .github/workflows/fix-voice-cafe.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix WebRTC state declarations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if s.strip() == '<!DOCTYPE html>':
              raise SystemExit('Refusing to modify the accidental test placeholder')
          old='const peers = {};\nconst remoteAudioEls = {};\nconst unsubs = [];\nlet seatsCache = {};'
          new='const peers = {};\nconst peerSessionIds = {};\nconst peerSignalUnsubs = {};\nconst remoteAudioEls = {};\nconst unsubs = [];\nlet mySessionId = null;\nlet seatsCache = {};'
          if old in s:
              s=s.replace(old,new,1)
          elif 'const peerSessionIds = {};' not in s:
              raise SystemExit('Expected state declaration block not found')
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix stale voice room membership and WebRTC rejoin state'
          git push
      - name: Remove one-shot workflow
        run: |
          rm -f .github/workflows/fix-voice-cafe.yml
          git add .github/workflows/fix-voice-cafe.yml
          git commit -m 'Remove one-shot voice cafe fixer' || true
          git push || true
