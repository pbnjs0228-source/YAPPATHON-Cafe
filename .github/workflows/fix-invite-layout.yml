name: Fix invite picker layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch invite layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''  .invite-user{ display:flex; align-items:center; gap:10px; padding:9px; border:1px solid var(--border); border-radius:12px; background:var(--bg-alt); }
  .invite-user img{ width:34px; height:34px; border-radius:50%; object-fit:cover; flex-shrink:0; }
  .invite-user-info{ min-width:0; flex:1; }
  .invite-user-name{ font-size:13px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .invite-user-sub{ color:var(--text-muted); font-size:11px; margin-top:2px; }'''
          new = '''  .invite-user{ display:grid; grid-template-columns:34px minmax(0,1fr); grid-template-rows:auto auto; align-items:center; column-gap:10px; row-gap:8px; padding:10px; border:1px solid var(--border); border-radius:12px; background:var(--bg-alt); }
  .invite-user img{ width:34px; height:34px; border-radius:50%; object-fit:cover; flex-shrink:0; grid-column:1; grid-row:1; }
  .invite-user-info{ min-width:0; grid-column:2; grid-row:1; }
  .invite-user-name{ font-size:14px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .invite-user-sub{ display:none; }
  .invite-user > .btn{ grid-column:1 / -1; grid-row:2; width:100%; margin:0; }'''
          if old not in s:
              raise SystemExit('Expected invite CSS block was not found; refusing to modify the file.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-invite-layout.yml
          git commit -m 'Fix invite picker user layout'
          git push
